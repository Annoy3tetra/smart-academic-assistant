<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduMint AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{margin:0;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;background:#f3f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .cardx{background:#fff;border:1px solid rgba(0,0,0,.05);border-radius:16px;padding:24px;box-shadow:0 12px 28px rgba(0,0,0,.08);text-align:center;max-width:420px;width:92%}
    h1{font-size:1.2rem;margin:0 0 .35rem}
    p{margin:0;color:#666}
  </style>
</head>
<body>
  <div class="cardx">
    <h1>EduMint AI</h1>
    <p id="status">Checking your role and opening dashboard...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJlQru_9q4kcnDmK6sFX0W-_GP3n0YYrA",
      authDomain: "testing-c2417.firebaseapp.com",
      projectId: "testing-c2417",
      storageBucket: "testing-c2417.firebasestorage.app",
      messagingSenderId: "27724276111",
      appId: "1:27724276111:web:a289d7642e1227818d6bfa",
      measurementId: "G-KTK16HRSX4"
    };

    const statusEl = document.getElementById("status");
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function go(path) {
      window.location.href = path;
    }

    async function resolveRoute(user) {
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        const userData = snap.exists() ? snap.data() : {};
        const role = String(userData?.role || "Student").toLowerCase();

        if (role.includes("admin") || role.includes("prof") || role.includes("hod")) {
          go("admin/index.html");
          return;
        }

        go("student-dashboard.html");
      } catch (error) {
        console.error("Route resolve failed:", error);
        statusEl.textContent = "Unable to load role. Please login again.";
        await signOut(auth);
        setTimeout(() => go("login.html"), 800);
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        go("login.html");
        return;
      }
      resolveRoute(user);
    });
  </script>
</body>
</html>
