<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - EduMint AI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary"><i class="bi bi-mortarboard-fill me-2"></i>EduMint AI</h3>
            <p class="text-muted small mode-title" id="formTitle">Welcome back.</p>
        </div>

        <form id="authForm">
            <div class="mb-3 hidden" id="nameField">
                <label class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="fullName" placeholder="e.g. Your Name">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-3 hidden" id="roleField">
                <label class="form-label">I am a...</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-badge"></i></span>
                    <select class="form-select border-start-0 ps-0" id="role">
                        <option value="Student" selected>Student</option>
                        <option value="Admin">Professor / Admin</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="submitBtn">Sign In</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted" id="toggleText">New here? <a href="#" id="toggleBtn" class="text-primary text-decoration-none fw-bold">Create Account</a></small>
        </div>
        
        <div id="status-msg" class="alert mt-3 d-none p-2 small text-center"></div>
    </div>

    <script type="module" src="assets/js/auth/login.js"></script>
    
</body>
</html>
