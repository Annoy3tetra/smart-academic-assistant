<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f3f4f6;       /* Light Gray Background */
      --surface: #ffffff;       /* Pure White Cards */
      --border: #e5e7eb;        /* Subtle Border */
      --text-main: #111827;     /* Almost Black */
      --text-muted: #6b7280;    /* Gray Text */
      --primary: #2563eb;       /* Standard Blue */
      --primary-hover: #1d4ed8;
    }

    body {
      background-color: var(--bg-body);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 2rem;
    }

    /* Layout Container */
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* Clean Card Style */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px; /* Standard professional radius */
      padding: 1.25rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* Very light shadow */
      height: 100%;
    }

    /* Header */
    .hero h1 { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.025em; color: var(--text-main); margin: 0; }
    .hero p { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem; }

    /* Buttons - Simple & Functional */
    .btn-pill {
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-weight: 500;
      font-size: 0.875rem;
      transition: all 0.15s;
    }
    .btn-main { background-color: var(--text-main); color: white; }
    .btn-main:hover { background-color: #000; color: white; }
    
    .btn-soft { background-color: white; border: 1px solid var(--border); color: var(--text-main); }
    .btn-soft:hover { background-color: #f9fafb; border-color: #d1d5db; }

    /* Metrics - Clean White Boxes */
    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100px;
    }
    .metric h6 { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0; font-weight: 600; }
    .metric .v { font-size: 1.8rem; font-weight: 700; color: var(--text-main); margin: 0.25rem 0; line-height: 1.2; }
    .metric .s { font-size: 0.8rem; color: var(--text-muted); }

    /* Inputs */
    .form-control, .form-select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      background-color: #fff;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }

    /* Lists */
    .list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 350px; overflow-y: auto; padding-right: 5px; }
    .item {
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0;
    }
    .item:last-child { border-bottom: none; }
    .item.done { opacity: 0.5; }
    
    .title { font-size: 1rem; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
    .meta { font-size: 0.75rem; color: var(--text-muted); }

    /* Badges */
    .tag, .chip { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; border: 1px solid transparent; }
    
    /* Subtle Colors for Tags */
    .tag.dsa { background: #eff6ff; color: #1e40af; border-color: #dbeafe; }
    .tag.core { background: #fff7ed; color: #9a3412; border-color: #ffedd5; }
    .tag.apt { background: #f0fdf4; color: #166534; border-color: #dcfce7; }
    .tag.beh { background: #fdf4ff; color: #6b21a8; border-color: #fae8ff; }

    .applied { background: #f3f4f6; color: #374151; }
    .oa { background: #fef9c3; color: #854d0e; }
    .interview { background: #eff6ff; color: #1d4ed8; }
    .offer { background: #dcfce7; color: #15803d; }
    .rejected { background: #fee2e2; color: #b91c1c; }

    /* Progress Bar */
    .bar { height: 6px; background: #f3f4f6; border-radius: 10px; overflow: hidden; }
    .fill { height: 100%; background: var(--text-main); }

    /* Skill Grid */
    .skillgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .skillbox { border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; background: #f9fafb; }
    .skillbox label { display: block; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
    .skillbox input { width: 100%; background: transparent; border: none; font-weight: 700; font-size: 1rem; color: var(--text-main); outline: none; }

    /* Helpers */
    .empty { padding: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); font-style: italic; }
    .insight { font-size: 0.85rem; padding: 0.5rem 0; border-bottom: 1px solid #f3f4f6; color: #374151; }
    .res { font-size: 0.75rem; text-decoration: none; color: var(--primary); font-weight: 500; }
    .res:hover { text-decoration: underline; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  </style>
</head>
<body>
<div class="wrap">
  <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div class="hero">
      <h1>Placement Tracker</h1>
      <p id="welcomeText">Loading user profile...</p>
    </div>
    <div class="d-flex gap-2">
      <button id="markTodayBtn" class="btn-pill btn-soft">Mark Today Done</button>
      <button id="syncBtn" class="btn-pill btn-main">Sync Data</button>
    </div>
  </header>

  <section class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="metric">
        <h6>Readiness</h6>
        <div class="v" id="mReadiness">--%</div>
        <div class="s" id="mReadinessSub">Calculating...</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric">
        <h6>Tasks</h6>
        <div class="v" id="mTasks">0/0</div>
        <div class="s">Completion rate</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric">
        <h6>Streak</h6>
        <div class="v" id="mStreak">0</div>
        <div class="s" id="mStreakSub">Days active</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="metric">
        <h6>Apps</h6>
        <div class="v" id="mApps">0</div>
        <div class="s" id="mAppsSub">Active rounds</div>
      </div>
    </div>
  </section>

  <section class="row g-4">
    <div class="col-lg-8 d-flex flex-column gap-4">
      
      <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="title"><i class="bi bi-check2-square text-primary"></i> Execution Planner</h2>
          <div class="d-flex align-items-center gap-2" style="width: 120px;">
            <div class="bar w-100"><div class="fill" id="taskFill" style="width:0%"></div></div>
            <span class="meta" id="taskProgressText">0%</span>
          </div>
        </div>

        <div class="row g-2 mb-2">
          <div class="col-md-5"><input id="taskTitle" class="form-control" placeholder="Task description..."></div>
          <div class="col-md-3"><select id="taskCategory" class="form-select"><option value="dsa">DSA</option><option value="core">Core CS</option><option value="aptitude">Aptitude</option><option value="behavioral">Behavioral</option></select></div>
          <div class="col-md-4"><input id="taskDue" type="date" class="form-control"></div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-md-8"><input id="taskLink" class="form-control" placeholder="Link (Optional)"></div>
          <div class="col-md-2 d-grid"><button id="addTask" class="btn-pill btn-main">Add</button></div>
          <div class="col-md-2 d-grid"><button id="seedTasks" class="btn-pill btn-soft">Auto</button></div>
        </div>
        <div id="taskList" class="list"></div>
      </div>

      <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="title"><i class="bi bi-briefcase text-primary"></i> Application Pipeline</h2>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-md-4"><input id="company" class="form-control" placeholder="Company"></div>
          <div class="col-md-3"><input id="role" class="form-control" placeholder="Role"></div>
          <div class="col-md-3"><select id="appStatus" class="form-select"><option>Applied</option><option>OA</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></div>
          <div class="col-md-2 d-grid"><button id="addApp" class="btn-pill btn-main">Track</button></div>
        </div>
        <div id="appList" class="list"></div>
      </div>
    </div>

    <div class="col-lg-4 d-flex flex-column gap-4">
      
      <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="title">Skill Matrix</h2>
          <span class="meta">0-100 Scale</span>
        </div>
        <div class="skillgrid mb-3">
          <div class="skillbox"><label for="sDsa">DSA</label><input id="sDsa" type="number" min="0" max="100"></div>
          <div class="skillbox"><label for="sApt">Aptitude</label><input id="sApt" type="number" min="0" max="100"></div>
          <div class="skillbox"><label for="sCore">Core</label><input id="sCore" type="number" min="0" max="100"></div>
          <div class="skillbox"><label for="sComm">Comm</label><input id="sComm" type="number" min="0" max="100"></div>
          <div class="skillbox"><label for="sProj">Project</label><input id="sProj" type="number" min="0" max="100"></div>
          <div class="skillbox"><label for="sResume">Resume</label><input id="sResume" type="number" min="0" max="100"></div>
        </div>
        
        <h2 class="title mb-2" style="font-size:0.9rem">Activity Log</h2>
        <div class="row g-2 mb-2">
          <div class="col-4"><input id="aDsa" type="number" class="form-control" placeholder="DSA Q"></div>
          <div class="col-4"><input id="aApt" type="number" class="form-control" placeholder="Apt Q"></div>
          <div class="col-4"><input id="aMock" type="number" class="form-control" placeholder="Mocks"></div>
        </div>
        <div class="meta text-center" id="skillHint">Update stats to recalibrate.</div>
      </div>

      <div class="panel">
         <h2 class="title mb-3">Benchmark</h2>
         <div id="benchList" class="list"></div>
      </div>

      <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="title">Insights</h2>
          <span class="meta" id="statusText">Ready</span>
        </div>
        <textarea id="note" class="form-control mb-2" rows="3" placeholder="Notes..."></textarea>
        <div id="insightList" class="list"></div>
      </div>
    </div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const cfg={apiKey:"AIzaSyDJlQru_9q4kcnDmK6sFX0W-_GP3n0YYrA",authDomain:"testing-c2417.firebaseapp.com",projectId:"testing-c2417",storageBucket:"testing-c2417.firebasestorage.app",messagingSenderId:"27724276111",appId:"1:27724276111:web:a289d7642e1227818d6bfa",measurementId:"G-KTK16HRSX4"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);

const S={user:null,userDoc:{},tracker:null,bench:null,timer:null};
const N={
 welcome:gid("welcomeText"),status:gid("statusText"),sync:gid("syncBtn"),today:gid("markTodayBtn"),
 mReadiness:gid("mReadiness"),mReadinessSub:gid("mReadinessSub"),mTasks:gid("mTasks"),mStreak:gid("mStreak"),mStreakSub:gid("mStreakSub"),mApps:gid("mApps"),mAppsSub:gid("mAppsSub"),taskFill:gid("taskFill"),taskProgressText:gid("taskProgressText"),
 taskList:gid("taskList"),taskTitle:gid("taskTitle"),taskCategory:gid("taskCategory"),taskDue:gid("taskDue"),taskLink:gid("taskLink"),addTask:gid("addTask"),seedTasks:gid("seedTasks"),
 company:gid("company"),role:gid("role"),appStatus:gid("appStatus"),addApp:gid("addApp"),appList:gid("appList"),
 sDsa:gid("sDsa"),sApt:gid("sApt"),sCore:gid("sCore"),sComm:gid("sComm"),sProj:gid("sProj"),sResume:gid("sResume"),aDsa:gid("aDsa"),aApt:gid("aApt"),aMock:gid("aMock"),skillHint:gid("skillHint"),
 benchList:gid("benchList"),insightList:gid("insightList"),note:gid("note")
};
function gid(id){return document.getElementById(id)}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d,avg=(arr)=>arr.length?arr.reduce((x,y)=>x+y,0)/arr.length:0,uid=()=>Math.random().toString(36).slice(2,10);
function todayISO(){const n=new Date();return new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().split("T")[0]}

function subjectMarks(doc){const raw=doc?.subject_marks??doc?.subjectMarks??doc?.marks;if(!raw)return[];if(Array.isArray(raw))return raw.map((e,i)=>e&&typeof e==="object"?{subject:String(e.subject??e.name??`s_${i+1}`),mark:num(e.mark??e.marks??e.score,NaN)}:{subject:`s_${i+1}`,mark:num(e,NaN)}).filter(x=>Number.isFinite(x.mark));if(typeof raw==="object")return Object.entries(raw).map(([s,m])=>({subject:String(s),mark:num(m,NaN)})).filter(x=>Number.isFinite(x.mark));return[]}
function seedTasks(doc){const weak=subjectMarks(doc).filter(x=>x.mark<60),out=[];weak.forEach(w=>out.push({id:uid(),title:`${w.subject.toUpperCase()} revision sprint`,category:"core",dueDate:todayISO(),link:"",done:false,createdAt:Date.now()}));[{t:"Solve 3 medium DSA problems",c:"dsa"},{t:"Timed aptitude quiz (30 mins)",c:"aptitude"},{t:"OS + DBMS revision",c:"core"},{t:"Record HR intro answers",c:"behavioral"},{t:"Update resume bullets",c:"behavioral"}].forEach((x,i)=>out.push({id:uid(),title:x.t,category:x.c,dueDate:new Date(Date.now()+i*86400000).toISOString().split("T")[0],link:"",done:false,createdAt:Date.now()+i}));return out}
function defaultTracker(doc={}){const marks=subjectMarks(doc).map(x=>x.mark),m=marks.length?avg(marks):60;return{tasks:seedTasks(doc),applications:[],skills:{dsa:clamp(Math.round(m),0,100),aptitude:clamp(Math.round(num(doc?.last_prediction_input?.attendance,60)),0,100),core:clamp(Math.round(m-5),0,100),communication:58,projects:50,resume:52},activity:{dsaSolved:0,aptitudeSolved:0,mocksGiven:0,studyLogDates:[]},notes:"",updatedAtLocal:Date.now()}}
function normTracker(raw,doc){const b=defaultTracker(doc);if(!raw||typeof raw!=="object")return b;const skills={...b.skills,...(raw.skills||{})},act={...b.activity,...(raw.activity||{})};return{tasks:(Array.isArray(raw.tasks)?raw.tasks:b.tasks).map(t=>({id:String(t.id||uid()),title:String(t.title||"Untitled").trim(),category:String(t.category||"dsa").toLowerCase(),dueDate:String(t.dueDate||todayISO()),link:String(t.link||""),done:Boolean(t.done),createdAt:num(t.createdAt,Date.now())})).filter(t=>t.title),applications:(Array.isArray(raw.applications)?raw.applications:[]).map(a=>({id:String(a.id||uid()),company:String(a.company||"").trim(),role:String(a.role||"").trim(),status:String(a.status||"Applied"),updatedAt:num(a.updatedAt,Date.now())})).filter(a=>a.company),skills:{dsa:clamp(num(skills.dsa,b.skills.dsa),0,100),aptitude:clamp(num(skills.aptitude,b.skills.aptitude),0,100),core:clamp(num(skills.core,b.skills.core),0,100),communication:clamp(num(skills.communication,b.skills.communication),0,100),projects:clamp(num(skills.projects,b.skills.projects),0,100),resume:clamp(num(skills.resume,b.skills.resume),0,100)},activity:{dsaSolved:clamp(num(act.dsaSolved,0),0,1e5),aptitudeSolved:clamp(num(act.aptitudeSolved,0),0,1e5),mocksGiven:clamp(num(act.mocksGiven,0),0,1e5),studyLogDates:Array.isArray(act.studyLogDates)?act.studyLogDates.map(String).filter(Boolean):[]},notes:String(raw.notes||"")}}
function streak(dates){const s=new Set(Array.from(new Set(dates)).sort());let d=new Date(todayISO()),n=0;for(;;){const k=d.toISOString().split("T")[0];if(!s.has(k))break;n++;d.setDate(d.getDate()-1)}return n}
function readiness(){const t=S.tracker,done=t.tasks.filter(x=>x.done).length,total=t.tasks.length,taskRate=total?done*100/total:0;const s=t.skills,skillScore=avg([s.dsa,s.aptitude,s.core,s.communication,s.projects,s.resume]);const bonus=clamp(t.activity.mocksGiven*2.5,0,10)+clamp((t.activity.dsaSolved+t.activity.aptitudeSolved)/25,0,10);return clamp(Math.round(skillScore*.65+taskRate*.25+bonus),0,100)}
const chip=(st)=>({Applied:"applied",OA:"oa",Interview:"interview",Offer:"offer",Rejected:"rejected"}[st]||"applied");
const tag=(c)=>({dsa:"dsa",core:"core",aptitude:"apt",behavioral:"beh"}[c]||"dsa");

function renderTasks(){const list=N.taskList;list.innerHTML="";const tasks=S.tracker.tasks.slice().sort((a,b)=>Number(a.done)-Number(b.done)||(a.dueDate>b.dueDate?1:-1));if(!tasks.length){list.innerHTML='<div class="empty">No tasks yet.</div>';return;}tasks.forEach(t=>{const el=document.createElement("div");el.className=`item ${t.done?"done":""}`;el.innerHTML=`<div class="d-flex justify-content-between align-items-start gap-2"><div><div class="fw-semibold">${t.title}</div><div class="meta">Due: ${t.dueDate||"--"}</div></div><div class="d-flex align-items-center gap-1"><span class="tag ${tag(t.category)}">${t.category.toUpperCase()}</span><button class="btn btn-sm text-danger p-0 task-del" data-id="${t.id}"><i class="bi bi-x-lg"></i></button></div></div><div class="d-flex justify-content-between align-items-center mt-2"><label class="d-flex align-items-center gap-2 m-0" style="cursor:pointer"><input class="form-check-input task-toggle" type="checkbox" data-id="${t.id}" ${t.done?"checked":""}><span class="meta">Done</span></label>${t.link?`<a class="res" href="${t.link}" target="_blank">Resource</a>`:""}</div>`;list.appendChild(el)})}
function renderApps(){const list=N.appList;list.innerHTML="";const apps=S.tracker.applications.slice().sort((a,b)=>b.updatedAt-a.updatedAt);if(!apps.length){list.innerHTML='<div class="empty">No applications.</div>';return;}apps.forEach(a=>{const el=document.createElement("div");el.className="item";el.innerHTML=`<div class="d-flex justify-content-between align-items-start gap-2"><div><div class="fw-semibold">${a.company}</div><div class="meta">${a.role||"Role"}</div></div><div class="d-flex align-items-center gap-2"><span class="chip ${chip(a.status)}">${a.status}</span><button class="btn btn-sm text-danger p-0 app-del" data-id="${a.id}"><i class="bi bi-x-lg"></i></button></div></div><div class="mt-2"><select class="form-select form-select-sm app-status" data-id="${a.id}"><option ${a.status==="Applied"?"selected":""}>Applied</option><option ${a.status==="OA"?"selected":""}>OA</option><option ${a.status==="Interview"?"selected":""}>Interview</option><option ${a.status==="Offer"?"selected":""}>Offer</option><option ${a.status==="Rejected"?"selected":""}>Rejected</option></select></div>`;list.appendChild(el)})}
function renderInputs(){const s=S.tracker.skills,a=S.tracker.activity;N.sDsa.value=s.dsa;N.sApt.value=s.aptitude;N.sCore.value=s.core;N.sComm.value=s.communication;N.sProj.value=s.projects;N.sResume.value=s.resume;N.aDsa.value=a.dsaSolved;N.aApt.value=a.aptitudeSolved;N.aMock.value=a.mocksGiven;N.note.value=S.tracker.notes||""}
function renderMetrics(){const t=S.tracker,total=t.tasks.length,done=t.tasks.filter(x=>x.done).length,p=total?Math.round(done*100/total):0,r=readiness(),st=streak(t.activity.studyLogDates||[]),live=t.applications.filter(x=>["OA","Interview"].includes(x.status)).length;N.mReadiness.textContent=`${r}%`;N.mReadinessSub.textContent=r>=75?"Strong":(r>=55?"Moderate":"Push Harder");N.mTasks.textContent=`${done}/${total}`;N.mStreak.textContent=`${st}`;N.mStreakSub.textContent="Days";N.mApps.textContent=String(t.applications.length);N.mAppsSub.textContent=`${live} Live`;N.taskFill.style.width=`${p}%`;N.taskProgressText.textContent=`${p}%`;N.skillHint.textContent=`DSA ${t.skills.dsa} | Apt ${t.skills.aptitude} | Core ${t.skills.core} | Comm ${t.skills.communication}`}
function actionInsights(){const t=S.tracker,s=t.skills,done=t.tasks.filter(x=>x.done).length,total=t.tasks.length,comp=total?done*100/total:0,out=[];if(s.dsa<60)out.push("DSA below 60: Solve 2 medium Qs daily.");if(s.aptitude<60)out.push("Aptitude weak: Do 20 quant/LR Qs.");if(s.communication<55)out.push("Communication low: Practice intros.");if(s.resume<65)out.push("Resume weak: Rewrite bullets.");if(comp<50)out.push("Execution low: Finish 3 tasks.");if(t.applications.filter(x=>x.status==="Rejected").length>=2)out.push("Rejections: Analyze mistakes.");if(!out.length)out.push("Good momentum. Keep going.");return out.slice(0,6)}
function renderInsights(){N.insightList.innerHTML="";actionInsights().forEach(x=>{const el=document.createElement("div");el.className="insight";el.textContent=x;N.insightList.appendChild(el)})}
function renderBench(){const b=S.bench;N.benchList.innerHTML="";if(!b){N.benchList.innerHTML='<div class="empty">Bench unavailable.</div>';return;}if(!S.tracker){N.benchList.innerHTML='<div class="empty">Wait for profile.</div>';return;}const s=S.tracker.skills;[{l:"Aptitude vs Avg",y:s.aptitude,b:b.aptitudeAvg},{l:"Technical vs Avg",y:s.dsa,b:b.technicalAvg*10},{l:"Comm vs Avg",y:s.communication,b:b.communicationAvg*10},{l:"Est Placement",y:null,b:b.placementRate}].forEach(i=>{const txt=i.y===null?`${i.l}: ${Math.round(i.b)}%`:`${i.l}: You ${Math.round(i.y)} / Avg ${Math.round(i.b)}`;const el=document.createElement("div");el.className="insight";el.textContent=txt;N.benchList.appendChild(el)})}
function rerender(){renderInputs();renderTasks();renderApps();renderMetrics();renderInsights();renderBench()}

async function save(show=false){if(!S.user||!S.tracker)return;N.status.textContent="Saving...";try{await setDoc(doc(db,"users",S.user.uid),{placement_tracker:{...S.tracker,updatedAtLocal:Date.now()},placement_tracker_updated_at:serverTimestamp()},{merge:true});N.status.textContent=show?"Saved":"Synced";}catch(e){console.error(e);N.status.textContent="Error"}}
function scheduleSave(){if(S.timer)clearTimeout(S.timer);S.timer=setTimeout(()=>save(false),500)}

function bind(){
 N.addTask.addEventListener("click",()=>{if(!S.tracker)return;const title=N.taskTitle.value.trim();if(!title)return;S.tracker.tasks.push({id:uid(),title,category:N.taskCategory.value,dueDate:N.taskDue.value||todayISO(),link:N.taskLink.value.trim(),done:false,createdAt:Date.now()});N.taskTitle.value="";N.taskLink.value="";rerender();scheduleSave()});
 N.seedTasks.addEventListener("click",()=>{if(!S.tracker)return;S.tracker.tasks=seedTasks(S.userDoc);rerender();scheduleSave()});
 N.taskList.addEventListener("click",(e)=>{if(!S.tracker)return;const d=e.target.closest(".task-del");if(!d)return;S.tracker.tasks=S.tracker.tasks.filter(t=>t.id!==d.dataset.id);rerender();scheduleSave()});
 N.taskList.addEventListener("change",(e)=>{if(!S.tracker)return;const c=e.target.closest(".task-toggle");if(!c)return;const t=S.tracker.tasks.find(x=>x.id===c.dataset.id);if(!t)return;t.done=c.checked;rerender();scheduleSave()});
 N.addApp.addEventListener("click",()=>{if(!S.tracker)return;const company=N.company.value.trim();if(!company)return;S.tracker.applications.push({id:uid(),company,role:N.role.value.trim(),status:N.appStatus.value,updatedAt:Date.now()});N.company.value="";N.role.value="";N.appStatus.value="Applied";rerender();scheduleSave()});
 N.appList.addEventListener("click",(e)=>{if(!S.tracker)return;const d=e.target.closest(".app-del");if(!d)return;S.tracker.applications=S.tracker.applications.filter(a=>a.id!==d.dataset.id);rerender();scheduleSave()});
 N.appList.addEventListener("change",(e)=>{if(!S.tracker)return;const s=e.target.closest(".app-status");if(!s)return;const a=S.tracker.applications.find(x=>x.id===s.dataset.id);if(!a)return;a.status=s.value;a.updatedAt=Date.now();rerender();scheduleSave()});
 [[N.sDsa,"dsa"],[N.sApt,"aptitude"],[N.sCore,"core"],[N.sComm,"communication"],[N.sProj,"projects"],[N.sResume,"resume"]].forEach(([n,k])=>n.addEventListener("input",()=>{if(!S.tracker)return;S.tracker.skills[k]=clamp(num(n.value,0),0,100);renderMetrics();renderInsights();renderBench();scheduleSave()}));
 N.aDsa.addEventListener("input",()=>{if(!S.tracker)return;S.tracker.activity.dsaSolved=clamp(num(N.aDsa.value,0),0,1e5);renderMetrics();scheduleSave()});
 N.aApt.addEventListener("input",()=>{if(!S.tracker)return;S.tracker.activity.aptitudeSolved=clamp(num(N.aApt.value,0),0,1e5);renderMetrics();scheduleSave()});
 N.aMock.addEventListener("input",()=>{if(!S.tracker)return;S.tracker.activity.mocksGiven=clamp(num(N.aMock.value,0),0,1e5);renderMetrics();renderInsights();scheduleSave()});
 N.note.addEventListener("input",()=>{if(!S.tracker)return;S.tracker.notes=N.note.value;scheduleSave()});
 N.today.addEventListener("click",()=>{if(!S.tracker)return;const t=todayISO();if(!S.tracker.activity.studyLogDates.includes(t)){S.tracker.activity.studyLogDates.push(t);S.tracker.activity.studyLogDates=Array.from(new Set(S.tracker.activity.studyLogDates)).sort();rerender();scheduleSave()}});
 N.sync.addEventListener("click",()=>save(true));
}

async function loadBench(){const p="../RAG%20MODEL/ml/datasets/demo_student_dataset.csv";try{const r=await fetch(p);if(!r.ok)throw new Error(`HTTP ${r.status}`);const t=await r.text();const lines=t.split(/\r?\n/).filter(Boolean);if(lines.length<2)return;const h=lines[0].split(",").map(s=>s.trim()),ix=Object.fromEntries(h.map((x,i)=>[x,i]));const rows=lines.slice(1).map(l=>l.split(","));const apt=[],tech=[],comm=[];let placed=0;rows.forEach(row=>{const a=num(row[ix.aptitude_score],NaN),te=num(row[ix.technical_skill],NaN),c=num(row[ix.communication_skill],NaN),pl=String(row[ix.placement_label]||"").trim();if(Number.isFinite(a))apt.push(a);if(Number.isFinite(te))tech.push(te);if(Number.isFinite(c))comm.push(c);if(pl==="Placed")placed++;});S.bench={aptitudeAvg:avg(apt),technicalAvg:avg(tech),communicationAvg:avg(comm),placementRate:rows.length?(placed/rows.length)*100:0};}catch(e){console.warn("bench unavailable",e);S.bench=null}}

async function initUser(user){S.user=user;N.status.textContent="Loading...";const snap=await getDoc(doc(db,"users",user.uid));S.userDoc=snap.exists()?(snap.data()||{}):{};const nm=String(S.userDoc.name||user.displayName||user.email||"Student").split("@")[0];N.welcome.textContent=`Welcome back, ${nm}.`;S.tracker=normTracker(S.userDoc.placement_tracker,S.userDoc);rerender();N.status.textContent="Synced"}

async function boot(){N.sync.disabled=true;N.today.disabled=true;bind();await loadBench();renderBench();onAuthStateChanged(auth,async(user)=>{if(!user){N.status.textContent="Login required";N.welcome.textContent="Please login to track progress.";N.sync.disabled=true;N.today.disabled=true;return;}N.sync.disabled=false;N.today.disabled=false;try{await initUser(user);}catch(e){console.error(e);N.status.textContent="Error";}})}
boot();
</script>
</body>
</html>
