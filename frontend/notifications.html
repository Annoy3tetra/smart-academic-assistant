<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#eef4ff;--panel:#fff;--ink:#172033;--muted:#66748f;--accent:#0f6cbd}
    body{margin:0;font-family:"Manrope",sans-serif;background:radial-gradient(circle at 2% 0,#dce9ff 0,transparent 34%),radial-gradient(circle at 100% 0,#ffe8db 0,transparent 30%),var(--bg);color:var(--ink);padding:1.25rem}
    .shell{max-width:1100px;margin:0 auto}
    .panel{background:var(--panel);border:1px solid rgba(17,33,70,.08);border-radius:18px;box-shadow:0 10px 24px rgba(17,28,56,.08);padding:1rem}
    .hero h1{font-size:clamp(1.25rem,2.4vw,1.9rem);margin:0;font-weight:800;letter-spacing:-.03em}
    .hero p{margin:.3rem 0 0;color:var(--muted);font-weight:600}
    .note-card{background:#fbfdff;border:1px solid rgba(18,35,75,.1);border-radius:14px;padding:.95rem}
    .badge-line{display:inline-flex;align-items:center;background:#e9f3ff;color:#104579;border:1px solid #cfe3ff;border-radius:999px;padding:.2rem .58rem;font-size:.72rem;font-weight:800}
    .note-title{font-weight:800;font-size:1rem;margin:.45rem 0 .35rem}
    .note-text{white-space:pre-wrap;color:#2b3c5c;line-height:1.55;font-weight:600}
    .meta{font-size:.8rem;color:var(--muted);font-weight:600}
    .empty{border:1px dashed rgba(20,40,90,.25);background:#f8fbff;border-radius:14px;padding:.9rem;color:var(--muted);font-weight:600}
    .status-pill{border-radius:999px;padding:.24rem .62rem;font-size:.7rem;font-weight:800}
    .status-new{background:#dcfce7;color:#166534}
    .status-none{background:#f3f4f6;color:#374151}
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1>Notifications</h1>
        <p>HOD remarks and guidance for your progress appear here.</p>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="noteStatus" class="status-pill status-none">No New Remark</span>
        <button id="refreshBtn" class="btn btn-sm btn-outline-primary rounded-pill px-3"><i class="bi bi-arrow-repeat me-1"></i>Refresh</button>
      </div>
    </header>

    <section class="panel">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 m-0 fw-bold"><i class="bi bi-megaphone-fill me-2 text-primary"></i>HOD Remark</h2>
        <span id="updatedAt" class="meta">Updated: --</span>
      </div>
      <div id="noteContainer" class="note-card d-none">
        <span class="badge-line"><i class="bi bi-person-badge me-1"></i>From HOD</span>
        <p class="note-title">Action Required</p>
        <p id="noteText" class="note-text m-0"></p>
      </div>
      <div id="emptyState" class="empty">No remark from HOD yet. Check later.</div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJlQru_9q4kcnDmK6sFX0W-_GP3n0YYrA",
      authDomain: "testing-c2417.firebaseapp.com",
      projectId: "testing-c2417",
      storageBucket: "testing-c2417.firebasestorage.app",
      messagingSenderId: "27724276111",
      appId: "1:27724276111:web:a289d7642e1227818d6bfa",
      measurementId: "G-KTK16HRSX4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const noteContainer = document.getElementById("noteContainer");
    const emptyState = document.getElementById("emptyState");
    const noteText = document.getElementById("noteText");
    const updatedAt = document.getElementById("updatedAt");
    const noteStatus = document.getElementById("noteStatus");
    const refreshBtn = document.getElementById("refreshBtn");

    let stopListening = null;
    let currentUser = null;

    function formatDate(value) {
      if (!value) return "--";
      if (typeof value.toDate === "function") return value.toDate().toLocaleString();
      const parsed = new Date(value);
      return Number.isFinite(parsed.getTime()) ? parsed.toLocaleString() : "--";
    }

    function renderRemark(data) {
      const remark = String(data?.hod_note || "").trim();
      if (!remark) {
        noteContainer.classList.add("d-none");
        emptyState.classList.remove("d-none");
        noteStatus.textContent = "No New Remark";
        noteStatus.className = "status-pill status-none";
        updatedAt.textContent = "Updated: --";
        return;
      }

      noteText.textContent = remark;
      noteContainer.classList.remove("d-none");
      emptyState.classList.add("d-none");
      noteStatus.textContent = "New Remark";
      noteStatus.className = "status-pill status-new";
      updatedAt.textContent = `Updated: ${formatDate(data?.hod_note_updated_at)}`;
    }

    async function loadOnce(uid) {
      const snap = await getDoc(doc(db, "users", uid));
      renderRemark(snap.exists() ? snap.data() : {});
    }

    function listenRemark(uid) {
      if (stopListening) stopListening();
      stopListening = onSnapshot(doc(db, "users", uid), (snap) => {
        renderRemark(snap.exists() ? snap.data() : {});
      }, (error) => {
        console.error("Notification listener error:", error);
      });
    }

    refreshBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      await loadOnce(currentUser.uid);
      await setDoc(doc(db, "users", currentUser.uid), {
        hod_notification_seen_at: serverTimestamp()
      }, { merge: true });
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      await loadOnce(user.uid);
      listenRemark(user.uid);
    });
  </script>
</body>
</html>
