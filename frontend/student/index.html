<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMint AI - Smart Academic Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
</head>

<body class="student-shell">

    <div class="sidebar d-flex flex-column">

        <div class="d-flex align-items-center mb-5 px-3 pt-2">
            <i class="bi bi-mortarboard-fill me-2 fs-3 text-primary"></i>
            <span class="logo-text">EduMint AI</span>
        </div>

        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a href="pages/dashboard-home.html" target="content-frame" class="nav-link active" onclick="setActive(this)">
                    <i class="bi bi-grid-fill me-2"></i> Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="pages/predict.html" target="content-frame" class="nav-link" onclick="setActive(this)">
                    <i class="bi bi-graph-up-arrow me-2"></i> Performance AI
                </a>
            </li>

            <li class="nav-item">
                <a href="pages/placement.html" target="content-frame" class="nav-link" onclick="setActive(this)">
                    <i class="bi bi-briefcase-fill me-2"></i> Placement Track
                </a>
            </li>

           

            <li class="nav-item">
                <a href="pages/course-guide.html" target="content-frame" class="nav-link" onclick="setActive(this)">
                    <i class="bi bi-book-half me-2"></i> Course Guide
                </a>
            </li>

            <li class="nav-item">
                <a href="pages/notifications.html" target="content-frame" class="nav-link" onclick="setActive(this)">

                </a>
            </li>

            <li class="nav-item">
                <a href="pages/rag-assistant.html" target="content-frame" class="nav-link" onclick="setActive(this)">

                </a>
            </li>

                <div>
                    <small class="d-block fw-bold text-dark" id="user-name">Loading...</small>
                    <small class="text-muted" style="font-size: 0.7rem;">Student</small>
                </div>
            </div>

            <button id="logout-btn" type="button" class="btn btn-sm btn-outline-danger w-100 border-0 text-start">
                <i class="bi bi-box-arrow-left me-2"></i> Sign Out
            </button>
        </div>
    </div>

    <div class="main-content-wrapper">
        <iframe name="content-frame" src="pages/dashboard-home.html"></iframe>

    <script type="module" src="../assets/js/student/shell.js"></script>
