<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="shell">
    <header class="hero d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1>Notifications</h1>
        <p>HOD remarks and guidance for your progress appear here.</p>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="noteStatus" class="status-pill status-none">No New Remark</span>
        <button id="refreshBtn" class="btn btn-sm btn-outline-primary rounded-pill px-3"><i class="bi bi-arrow-repeat me-1"></i>Refresh</button>
      </div>
    </header>

    <section class="panel">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 m-0 fw-bold"><i class="bi bi-megaphone-fill me-2 text-primary"></i>HOD Remark</h2>
        <span id="updatedAt" class="meta">Updated: --</span>
      </div>
      <div id="noteContainer" class="note-card d-none">
        <span class="badge-line"><i class="bi bi-person-badge me-1"></i>From HOD</span>
        <p class="note-title">Action Required</p>
        <p id="noteText" class="note-text m-0"></p>
      </div>
      <div id="emptyState" class="empty">No remark from HOD yet. Check later.</div>
    </section>
  </div>

  <script type="module" src="../../assets/js/student/pages/notifications.js"></script>
</body>
</html>
