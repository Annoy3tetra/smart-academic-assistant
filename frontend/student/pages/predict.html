<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Mark Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

        <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div class="container-fluid max-w-lg">
        <div class="row justify-content-center">

            <div class="col-12 mb-4 text-center">
                <h2 class="fw-bold text-primary">AI Mark Predictor</h2>
                <p class="text-muted">Enter each subject mark. Average will be computed automatically for prediction.
                </p>
            </div>

            <div class="col-md-8 col-lg-6">
                <div class="custom-card">
                    <form id="predictionForm" onsubmit="handlePrediction(event)">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="totalSubjects" class="form-label">Total Subjects</label>
                                <input type="number" class="form-control" id="totalSubjects" placeholder="e.g. 5" required
                                    min="4" max="7" step="1" value="5">
                            </div>

                            <div class="col-md-6">
                                <label for="attendance" class="form-label">Attendance (%)</label>
                                <input type="number" class="form-control" id="attendance" placeholder="e.g. 85" required
                                    min="0" max="100" step="0.1">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Subject Marks (0-100)</label>
                                <div class="row g-2" id="subjectMarksContainer"></div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit"
                                class="btn btn-predict d-flex justify-content-center align-items-center gap-2">
                                <span id="btn-text">Predict Score</span>
                                <div id="loader" class="spinner-border spinner-border-sm text-white d-none"
                                    role="status"></div>
                            </button>
                        </div>

                    </form>
                </div>

                <div id="result-card">
                    <h5 class="fw-bold mb-3 text-muted">Predicted Semester Score</h5>

                    <div class="score-circle" id="scoreCircle">
                        <span class="score-text" id="scoreValue">0%</span>
                    </div>

                    <p class="text-muted small">Based on your performance trend, this is your estimated outcome.</p>
                    <div class="alert alert-light text-primary border-0 bg-primary bg-opacity-10">
                        <i class="bi bi-robot me-2"></i> Model Confidence: <strong>92%</strong>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="module" src="../../assets/js/student/pages/predict.js"></script>
</body>

</html>
