<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #00b894;
            --bg-color: #f3f4f8;
            --card-radius: 20px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, rgba(108, 92, 231, 0.12), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(0, 184, 148, 0.1), transparent 35%),
                        var(--bg-color);
            color: #2d3436;
            min-height: 100vh;
            padding: 30px;
        }

        .custom-card {
            background: white;
            border: none;
            border-radius: var(--card-radius);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .query-input {
            border-radius: 14px;
            border: 1px solid #e9ecef;
            min-height: 140px;
            resize: vertical;
            padding: 14px 16px;
            font-size: 0.96rem;
        }

        .query-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(108, 92, 231, 0.16);
        }

        .btn-ask {
            background: linear-gradient(135deg, var(--primary-color) 0%, #8575ff 60%, #6dc7ff 100%);
            border: none;
            color: white;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 600;
        }

        .btn-ask:disabled {
            opacity: 0.8;
        }

        #answer-box {
            white-space: pre-wrap;
            line-height: 1.65;
            font-size: 0.96rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-xl-10">
                <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-2">
                    <div>
                        <h2 class="fw-bold mb-1"><i class="bi bi-chat-square-text-fill text-primary me-2"></i>RAG Assistant</h2>
                        <p class="text-muted mb-0">Ask academic or programming questions from your indexed knowledge base.</p>
                    </div>
                </div>

                <div class="custom-card mb-4">
                    <label for="query" class="form-label fw-semibold">Your Question</label>
                    <textarea id="query" class="form-control query-input" placeholder="Example: Explain overfitting with a simple machine learning example."></textarea>
                    <div class="d-flex align-items-center gap-3 mt-3">
                        <button id="ask-btn" class="btn btn-ask d-inline-flex align-items-center gap-2">
                            <span id="ask-btn-text">Ask RAG Model</span>
                            <span id="ask-loader" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                        </button>
                        <small id="status-text" class="text-muted"></small>
                    </div>
                </div>

                <div class="custom-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold m-0">Response</h5>
                    </div>
                    <div id="answer-box" class="text-muted">Your answer will appear here.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASES = [
            window.localStorage.getItem("apiBaseUrl"),
            "http://127.0.0.1:8000",
            "http://localhost:8000"
        ].filter(Boolean);

        const queryInput = document.getElementById("query");
        const askBtn = document.getElementById("ask-btn");
        const askBtnText = document.getElementById("ask-btn-text");
        const askLoader = document.getElementById("ask-loader");
        const statusText = document.getElementById("status-text");
        const answerBox = document.getElementById("answer-box");

        function setLoading(loading) {
            askBtn.disabled = loading;
            askLoader.classList.toggle("d-none", !loading);
            askBtnText.textContent = loading ? "Thinking..." : "Ask RAG Model";
        }

        async function callRagEndpoint(payload) {
            let lastError = null;

            for (const base of API_BASES) {
                try {
                    const response = await fetch(`${base}/students/rag-query`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const text = await response.text();
                        throw new Error(text || `Request failed with status ${response.status}`);
                    }

                    return await response.json();
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error("RAG endpoint unavailable");
        }

        async function askQuestion() {
            const query = queryInput.value.trim();
            if (query.length < 3) {
                statusText.textContent = "Enter at least 3 characters.";
                statusText.className = "text-danger";
                return;
            }

            setLoading(true);
            statusText.textContent = "Sending query to RAG model...";
            statusText.className = "text-muted";
            answerBox.textContent = "Generating answer...";
            answerBox.className = "text-muted";

            try {
                const data = await callRagEndpoint({ query });
                const answer = String(data?.answer || "").trim();
                answerBox.textContent = answer || "No answer returned.";
                answerBox.className = "text-dark";
                statusText.textContent = "Response generated successfully.";
                statusText.className = "text-success";
            } catch (error) {
                console.error("RAG request failed:", error);
                answerBox.textContent = "Could not fetch answer from RAG model.";
                answerBox.className = "text-danger";
                statusText.textContent = error.message || "Request failed.";
                statusText.className = "text-danger";
            } finally {
                setLoading(false);
            }
        }

        askBtn.addEventListener("click", askQuestion);
        queryInput.addEventListener("keydown", (event) => {
            if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
                askQuestion();
            }
        });
    </script>
</body>
</html>
